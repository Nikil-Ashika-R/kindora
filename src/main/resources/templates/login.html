
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindora | Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f7f1;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            color: #218838;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            color: #c62828;
            text-align: center;
        }

        .success {
            color: #218838;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Kindora</h1>
    <p>Login to your account</p>

    <p class="error" th:if="${param.error}">
        Invalid email or password.
    </p>

    <p class="success" th:if="${param.registered}">
        Registration successful! Please log in.
    </p>

    <form th:action="@{/login}" method="post">
        <label for="username">Email</label>
        <input type="email" id="username" name="username"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a th:href="@{/register}">Register here</a>
    </p>
</div>
</body>
</html>
